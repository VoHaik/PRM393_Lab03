name: journal_trend_analyzer
description: A Journal Trend Analysis mobile application using Flutter and OpenAlex API.
version: 1.0.0+1

publish_to: "none"

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # UI & Styling
  google_fonts: ^6.1.0
  font_awesome_flutter: ^11.0.0
  shimmer: ^3.0.0
  url_launcher: ^6.2.5
  pdf: ^3.10.8

  # Navigation & Routing
  go_router: ^13.2.0

  # State Management & Dependency Injection
  provider: ^6.1.2
  get_it: ^7.6.0

  # Firebase Services
  firebase_core: ^2.32.0
  firebase_auth: ^4.20.0
  google_sign_in: ^6.2.1
  firebase_analytics: ^10.8.0
  firebase_storage: ^11.2.0
  firebase_messaging: ^14.9.4
  firebase_crashlytics: ^3.5.7
  firebase_remote_config: ^4.4.7

  # Networking & Caching
  dio: ^5.4.0
  dio_cache_interceptor: ^3.4.4
  dio_cache_interceptor_hive_store: ^3.2.2
  path_provider: ^2.1.2

  # Charts & Visualizations
  fl_chart: ^0.66.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter

  patrol: 3.20.0
  mocktail: ^1.0.3
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: "launcher_icon"
  image_path: "assets/icon/app_icon.png"
  min_sdk_android: 21

flutter:
  uses-material-design: true
  assets:
    - .env.json.example
